<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Economic News Audio Player</title>
  <style>
    :root {
      --primary: #1e3a8a; --primary-light: #3b82f6; --danger: #dc2626;
      --hl-bg: #fef08a; --hl-bd: #ca8a04; --bg: #f8fafc; --card: #ffffff;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --safe: env(safe-area-inset-bottom, 16px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: calc(155px + var(--safe)); line-height: 1.6; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 40; font-size: 1.05rem; font-weight: 700; color: var(--primary); }
    .tabs { background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; padding: 8px 12px; display: flex; gap: 8px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border); background: #f1f5f9; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tab.add { background: #eff6ff; color: var(--primary); border-color: #bfdbfe; }
    .tab.add.active { background: var(--primary); color: #fff; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 14px; }
    .title-ja { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .title-en { font-size: 0.9rem; color: var(--primary-light); font-weight: 600; margin-bottom: 6px; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
    .chunks { font-size: 1.12rem; line-height: 1.9; }
    .chunk { display: inline; padding: 2px 5px; border-radius: 6px; cursor: pointer; }
    .chunk.active { background: var(--hl-bg); box-shadow: 0 0 0 2px var(--hl-bd); font-weight: 700; color: #78350f; }
    .trans { background: #f8fafc; border-radius: 10px; padding: 12px; font-size: 0.88rem; color: #334155; border-left: 4px solid var(--primary-light); }
    input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #cbd5e1; font-size: 16px; background: #fff; color: var(--text); margin-bottom: 10px; -webkit-user-select: text; user-select: text; }
    textarea { height: 130px; }
    .row { display: flex; gap: 8px; }
    .btn { flex: 1; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .btn-sub { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-del { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.98); border-top: 1px solid var(--border); padding: 10px 16px calc(12px + var(--safe)); z-index: 50; max-width: 720px; margin: 0 auto; }
    .bar-wrap { width: 100%; height: 4px; background: #e2e8f0; border-radius: 2px; margin-bottom: 10px; }
    .bar { height: 100%; width: 0%; background: var(--primary-light); transition: width 0.2s; }
    .ctrls { display: flex; align-items: center; justify-content: space-between; }
    .cbtn { background: #f1f5f9; border: 1px solid var(--border); width: 42px; height: 42px; border-radius: 50%; font-size: 1.05rem; cursor: pointer; }
    .pbtn { width: 52px; height: 52px; background: var(--primary); color: #fff; border: none; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
    .pill { padding: 6px 10px; border-radius: 16px; font-size: 0.78rem; font-weight: 700; border: 1px solid var(--border); background: #f8fafc; color: var(--muted); cursor: pointer; }
    .pill.on { background: #dbeafe; color: var(--primary); border-color: #93c5fd; }
    .srow { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
    select { font-size: 0.75rem; padding: 4px; border-radius: 6px; border: 1px solid var(--border); max-width: 185px; }
    .toast { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>🎧 Economic News Audio Player</header>
  <div class="tabs" id="tabs"></div>
  <main class="container" id="main"></main>
  <div class="toast" id="toast"></div>

  <div class="dock">
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="ctrls">
      <button class="pill" id="spdBtn" onclick="toggleSpeed()">1.0x</button>
      <button class="cbtn" onclick="prevU()">⏮</button>
      <button class="pbtn" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="cbtn" onclick="nextU()">⏭</button>
      <button class="pill on" id="modeBtn" onclick="toggleMode()">文単位</button>
    </div>
    <div class="srow">
      <span id="cnt">0 / 0</span>
      <div>Voice: <select id="vSel" onchange="changeVoice()"></select></div>
    </div>
  </div>

  <script>
    const KEY = 'econ_news_v2';
    const DEFAULTS = [
      {
        titleJa: "東京為替市場：ドル円159円台後半で一進一退、160円を前に介入警戒感",
        titleEn: "Dollar-Yen Trades in Upper 159 Range Amid Intervention Vigilance",
        source: "東京外国為替市場レポート (2026年11月)",
        contentJa: "東京外国為替市場において、ドル・円相場は1ドル＝159円台後半を中心に一進一退の展開が続いています。米国の底堅いインフレ指標や長期金利の上昇がドル買いを支える一方、日本の通貨当局による口頭牽制や為替介入への警戒感が160円付近での上値を抑えています。",
        chunks: [
          "In the Tokyo foreign exchange market, ", "the U.S. dollar-yen currency pair ", "traded in a tight range ", "in the upper 159 yen level. ",
          "While resilient U.S. inflation indicators ", "and elevated Treasury yields ", "continue to underpin dollar demand, ",
          "strong vigilance over verbal warnings ", "and potential currency interventions ", "by Japanese monetary authorities ", "is capping upward momentum near the 160 threshold."
        ]
      },
      {
        titleJa: "7〜9月期実質GDP速報値：個人消費と設備投資が下支えし緩やかな成長維持",
        titleEn: "Q3 Real GDP Maintains Modest Growth on Consumption and Capex",
        source: "内閣府 四半期別GDP速報 (2026年11月)",
        contentJa: "内閣府が公表した2026年7〜9月期の実質GDP速報値は、賃上げ効果に支えられた個人消費や企業のデジタル化投資が景気を下支えし、緩やかなプラス成長を維持しました。日本銀行の今後の金融政策判断への影響が注目されています。",
        chunks: [
          "Preliminary real gross domestic product (GDP) data ", "for the third quarter of 2026, ", "released by the Cabinet Office, ", "showed that Japan's economy maintained modest positive growth. ",
          "Private consumption supported by wage hikes ", "and corporate capital expenditures in digitalization ", "underpinned economic activity, ", "keeping market focus on the Bank of Japan's upcoming policy decisions."
        ]
      },
      {
        titleJa: "日銀の金融政策正常化と国内長期金利：追加利上げ時期を見極める展開",
        titleEn: "Bond Markets Gauge Timing of Next BOJ Rate Hike",
        source: "日本銀行・国内債券市場動向 (2026年11月)",
        contentJa: "日本銀行が基調的な物価上昇率について2%の物価安定目標に到達したとの判断を示したことを受け、国内債券市場では追加利上げの時期を見極める動きが続いています。",
        chunks: [
          "Following the Bank of Japan's assessment ", "that underlying inflation has reached ", "its 2% price stability target, ",
          "domestic bond markets continue to gauge ", "the timing of the next interest rate hike. ",
          "With benchmark 10-year government bond yields ", "remaining at elevated levels, ", "analysts are closely monitoring shifts in corporate financing costs."
        ]
      }
    ];

    let articles = [], tab = 0, uIdx = 0, playing = false, rate = 1.0, bySentence = true;
    let voices = [], selVoice = null, timer = null, customRaw = "", customChunks = [];

    function init() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        articles = (Array.isArray(s) && s.length) ? s : [...DEFAULTS];
      } catch { articles = [...DEFAULTS]; }
      renderTabs(); renderMain(); initSpeech();
    }

    function save() { try { localStorage.setItem(KEY, JSON.stringify(articles)); } catch {} }
    function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

    async function pasteTo(id) {
      const el = document.getElementById(id);
      try { const txt = await navigator.clipboard.readText(); if (txt) { el.value = txt; toast("貼り付けました"); } }
      catch { el.focus(); toast("枠内を長押しして貼り付けてください"); }
    }

    function initSpeech() {
      if (!('speechSynthesis' in window)) return;
      const loadV = () => {
        const score = v => {
          const n = v.name.toLowerCase(), l = v.lang.toLowerCase();
          return (l === 'en-us' ? 30 : 10) + (n.includes('natural') ? 50 : 0) + (n.includes('google us') ? 40 : 0) + (!v.localService ? 15 : 0);
        };
        voices = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('en')).sort((a,b) => score(b) - score(a));
        const sel = document.getElementById('vSel'); sel.innerHTML = '';
        voices.forEach((v, i) => {
          const o = document.createElement('option'); o.value = i; o.textContent = `${v.name} (${v.lang})`;
          if (!selVoice && i === 0) { o.selected = true; selVoice = v; }
          sel.appendChild(o);
        });
      };
      loadV(); speechSynthesis.onvoiceschanged = loadV;
    }

    function changeVoice() { selVoice = voices[document.getElementById('vSel').value]; if (playing) { stop(); playU(uIdx); } }

    function renderTabs() {
      const w = document.getElementById('tabs'); w.innerHTML = '';
      articles.forEach((_, i) => {
        const b = document.createElement('button'); b.className = `tab ${tab === i ? 'active' : ''}`;
        b.textContent = `News ${i + 1}`; b.onclick = () => switchTab(i); w.appendChild(b);
      });
      const c = document.createElement('button'); c.className = `tab ${tab === 'custom' ? 'active' : ''}`;
      c.textContent = "自由入力"; c.onclick = () => switchTab('custom'); w.appendChild(c);
      const a = document.createElement('button'); a.className = `tab add ${tab === 'import' ? 'active' : ''}`;
      a.textContent = "＋ ニュース追加"; a.onclick = () => switchTab('import'); w.appendChild(a);
    }

    function switchTab(t) { stop(); tab = t; uIdx = 0; renderTabs(); renderMain(); updateUI(); }

    function parseText(t) {
      if (!t) return [];
      return t.includes('/') ? t.split('/').map(s => s.trim() + ' ').filter(s => s.length > 1)
        : (t.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [t]).map(s => s.trim() + ' ');
    }

    function getChunks() {
      if (tab === 'custom') return customChunks;
      return (typeof tab === 'number' && articles[tab]) ? articles[tab].chunks : [];
    }

    function getUnits() {
      const ch = getChunks();
      if (!bySentence) return ch.map((t, i) => ({ text: t.trim(), idxs: [i] }));
      const u = []; let buf = "", idxs = [];
      ch.forEach((c, i) => {
        const cl = c.trim(); buf += (buf ? " " : "") + cl; idxs.push(i);
        if (/[.!?]["']?$/.test(cl) || i === ch.length - 1) { u.push({ text: buf, idxs: [...idxs] }); buf = ""; idxs = []; }
      });
      return u;
    }

    function renderMain() {
      const m = document.getElementById('main');
      if (tab === 'import') {
        m.innerHTML = `
          <div class="card">
            <h3 style="font-size:1rem;margin-bottom:8px;color:var(--primary);">📥 JSONでニュース一括追加</h3>
            <textarea id="jsonIn" placeholder='[{"titleJa":"...","titleEn":"...","chunks":[...]}]'></textarea>
            <div class="row">
              <button class="btn-sub" onclick="pasteTo('jsonIn')">📋 貼り付け</button>
              <button class="btn" onclick="importJson()">タブに追加</button>
            </div>
          </div>
          <div class="card">
            <h3 style="font-size:0.95rem;margin-bottom:8px;color:var(--primary);">✍️ 手動で1記事追加</h3>
            <input type="text" id="mJa" placeholder="日本語タイトル">
            <input type="text" id="mEn" placeholder="英語タイトル">
            <textarea id="mCh" style="height:90px;" placeholder="英文（ / で区切ると分割されます）"></textarea>
            <textarea id="mTr" style="height:70px;" placeholder="日本語訳・解説"></textarea>
            <button class="btn" style="width:100%;" onclick="addManual()">この内容で追加</button>
          </div>`;
        return;
      }
      if (tab === 'custom') {
        m.innerHTML = `
          <div class="card">
            <h3 style="font-size:1rem;margin-bottom:8px;">任意の英文を入力</h3>
            <textarea id="cIn" placeholder="ここに英文を入力または貼り付け...">${customRaw}</textarea>
            <div class="row">
              <button class="btn-sub" onclick="pasteTo('cIn')">📋 貼り付け</button>
              <button class="btn" onclick="applyCustom()">読み込む</button>
            </div>
          </div>
          <div class="card"><div class="chunks" id="cBox"></div></div>`;
        renderChunks(); return;
      }
      const art = articles[tab]; if (!art) return;
      m.innerHTML = `
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div class="title-ja">${art.titleJa}</div>
          ${articles.length > 1 ? `<button class="btn-del" onclick="delArt()">削除</button>` : ''}
        </div>
        <div class="title-en">${art.titleEn}</div>
        <div class="meta">出典: ${art.source || ''}</div>
        <div class="card"><div class="chunks" id="cBox"></div></div>
        ${art.contentJa ? `<div class="trans"><strong>日本語解説:</strong><br>${art.contentJa}</div>` : ''}`;
      renderChunks();
    }

    function renderChunks() {
      const box = document.getElementById('cBox'); if (!box) return;
      const ch = getChunks();
      if (!ch.length) { box.innerHTML = '<span style="color:var(--muted);font-size:0.9rem;">英文を入力して「読み込む」を押してください。</span>'; updateUI(); return; }
      box.innerHTML = '';
      ch.forEach((c, i) => {
        const s = document.createElement('span'); s.className = 'chunk'; s.id = `ch-${i}`; s.textContent = c;
        s.onclick = () => { stop(); const idx = getUnits().findIndex(u => u.idxs.includes(i)); uIdx = idx >= 0 ? idx : 0; playU(uIdx); };
        box.appendChild(s);
      });
      updateUI();
    }

    function applyCustom() {
      customRaw = document.getElementById('cIn').value.trim();
      customChunks = parseText(customRaw); uIdx = 0; renderChunks();
      if (customChunks.length) toast("読み込みました");
    }

    function importJson() {
      try {
        const raw = document.getElementById('jsonIn').value.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```$/i,'');
        const list = JSON.parse(raw);
        (Array.isArray(list) ? list : [list]).forEach(it => {
          if (it.chunks) articles.push({ titleJa: it.titleJa || "経済ニュース", titleEn: it.titleEn || "News", source: it.source || "", contentJa: it.contentJa || "", chunks: it.chunks });
        });
        save(); toast("ニュースを追加しました"); switchTab(articles.length - 1);
      } catch { alert("JSONの形式が正しくありません。"); }
    }

    function addManual() {
      const ch = parseText(document.getElementById('mCh').value.trim());
      if (!ch.length) return toast("英文を入力してください");
      articles.push({ titleJa: document.getElementById('mJa').value || "経済ニュース", titleEn: document.getElementById('mEn').value || "News", source: "手動追加", contentJa: document.getElementById('mTr').value, chunks: ch });
      save(); toast("追加しました"); switchTab(articles.length - 1);
    }

    function delArt() {
      if (!confirm("この記事を削除しますか？")) return;
      articles.splice(tab, 1); save(); switchTab(Math.max(0, tab - 1));
    }

    function togglePlay() { playing ? stop() : (getUnits().length && playU(uIdx)); }
    function stop() { clearTimeout(timer); speechSynthesis.cancel(); playing = false; updateUI(); }

    function playU(idx) {
      const units = getUnits();
      if (idx >= units.length) { stop(); uIdx = 0; updateUI(); return; }
      clearTimeout(timer); speechSynthesis.cancel(); playing = true; uIdx = idx; updateUI();
      const ut = new SpeechSynthesisUtterance(units[idx].text.replace(/\s+/g, ' '));
      ut.rate = rate; ut.pitch = 0.98;
      if (selVoice) { ut.voice = selVoice; ut.lang = selVoice.lang; } else ut.lang = 'en-US';
      ut.onend = () => { if (playing) timer = setTimeout(() => playing && playU(uIdx + 1), bySentence ? 350 : 120); };
      ut.onerror = () => stop();
      speechSynthesis.speak(ut);
    }

    function nextU() { if (uIdx < getUnits().length - 1) { uIdx++; playing ? playU(uIdx) : updateUI(); } }
    function prevU() { if (uIdx > 0) { uIdx--; playing ? playU(uIdx) : updateUI(); } }
    function toggleSpeed() { const r = [0.85, 1.0, 1.15]; rate = r[(r.indexOf(rate) + 1) % 3]; document.getElementById('spdBtn').textContent = rate.toFixed(2).replace(/\.00$/,'.0') + 'x'; if (playing) playU(uIdx); }
    function toggleMode() { const w = playing; stop(); bySentence = !bySentence; uIdx = 0; const b = document.getElementById('modeBtn'); b.textContent = bySentence ? "文単位" : "チャンク"; b.classList.toggle('on', bySentence); updateUI(); if (w) playU(0); }

    function updateUI() {
      document.getElementById('playBtn').textContent = playing ? '⏸' : '▶';
      const units = getUnits(), tot = units.length;
      document.getElementById('cnt').textContent = tot ? `${uIdx + 1} / ${tot}` : '0 / 0';
      document.getElementById('bar').style.width = (tot ? ((uIdx + 1) / tot) * 100 : 0) + '%';
      const act = (units[uIdx] && playing) ? units[uIdx].idxs : [];
      getChunks().forEach((_, i) => { const el = document.getElementById(`ch-${i}`); if (el) el.classList.toggle('active', act.includes(i)); });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
